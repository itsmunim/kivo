name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  packages: write

jobs:
  # Single job computes the next version and creates the git tag once.
  version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version
        id: get_version
        run: |
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Current version: $latest"

      - name: Calculate new version
        id: bump_version
        run: |
          latest="${{ steps.get_version.outputs.latest }}"
          bump="${{ github.event.inputs.version_bump }}"

          # Remove 'v' prefix if present
          ver="${latest#v}"

          major=$(echo "$ver" | cut -d. -f1)
          minor=$(echo "$ver" | cut -d. -f2)
          patch=$(echo "$ver" | cut -d. -f3)

          case "$bump" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          new_version="v${major}.${minor}.${patch}"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "New version: $new_version"

      - name: Create and push tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "${{ steps.bump_version.outputs.new_version }}"
          git push origin "${{ steps.bump_version.outputs.new_version }}"

  # Build each arch natively (no QEMU), pushing to arch-suffixed tags.
  build-and-push:
    needs: version
    name: build (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arch-specific tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.new_version }}-${{ matrix.suffix }}
            ghcr.io/${{ github.repository }}:latest-${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Merge the per-arch tags into a single multi-arch index for the plain tags.
  merge-manifest:
    needs: [version, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest (version tag)
        run: |
          VERSION="${{ needs.version.outputs.new_version }}"
          REPO="ghcr.io/${{ github.repository }}"
          docker buildx imagetools create -t "$REPO:$VERSION" \
            "$REPO:$VERSION-amd64" "$REPO:$VERSION-arm64"

      - name: Create multi-arch manifest (latest)
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          docker buildx imagetools create -t "$REPO:latest" \
            "$REPO:latest-amd64" "$REPO:latest-arm64"

      - name: Output image URL
        run: |
          echo "Multi-arch image: ghcr.io/${{ github.repository }}:${{ needs.version.outputs.new_version }}"